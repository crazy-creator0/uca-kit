<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Our Solar System: a 3D model</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(12, 16, 36, 0.86);
    --line: rgba(255, 255, 255, 0.16);
    --text: #eef2ff;
    --muted: #b4bcd8;
    --accent: #ffcf5a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #03040b;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }
  canvas.over-planet { cursor: pointer; }

  .top {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px 16px;
    padding: max(14px, env(safe-area-inset-top)) 18px 0 18px;
    pointer-events: none;
  }
  .intro { max-width: 32rem; }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 3.2vw, 2.3rem);
    letter-spacing: 0.01em;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
  }
  .how {
    margin: 0.3rem 0 0;
    color: var(--muted);
    font-size: clamp(0.9rem, 1.6vw, 1.05rem);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
  }
  .scale-note {
    display: inline-block;
    margin: 0.55rem 0 0;
    padding: 0.4rem 0.7rem;
    font-size: clamp(0.82rem, 1.4vw, 0.95rem);
    line-height: 1.35;
    color: #f3e6c4;
    background: rgba(255, 207, 90, 0.1);
    border: 1px solid rgba(255, 207, 90, 0.35);
    border-radius: 10px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    pointer-events: auto;
  }
  button {
    font: inherit;
    font-size: 1rem;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.55rem 1rem;
    min-height: 44px;
    cursor: pointer;
  }
  button:hover { border-color: rgba(255, 255, 255, 0.4); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .chips {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    gap: 8px;
    padding: 10px 14px max(12px, env(safe-area-inset-bottom));
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips > :first-child { margin-left: auto; }
  .chips > :last-child { margin-right: auto; }
  .chip {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0.5rem 0.9rem;
  }
  .chip .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    box-shadow: inset -3px -3px 5px rgba(0, 0, 0, 0.45);
  }
  .chip[aria-pressed="true"] {
    border-color: var(--accent);
    background: rgba(60, 48, 12, 0.9);
  }

  .info {
    position: fixed;
    left: 50%;
    bottom: calc(76px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(94vw, 580px);
    padding: 16px 22px 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    animation: pop 0.18s ease-out;
  }
  .info[hidden] { display: none; }
  @keyframes pop {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  /* Wide screens (laptop, tablet sideways): put the card in the empty top-right corner
     so it does not cover the planets. */
  @media (min-width: 900px) and (min-aspect-ratio: 5/4) {
    .info {
      left: auto;
      right: 18px;
      bottom: auto;
      top: 76px;
      transform: none;
      width: min(400px, calc(100vw - 560px));
      animation-name: pop-side;
    }
    @keyframes pop-side {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  }
  .info-head { display: flex; align-items: center; gap: 12px; padding-right: 44px; }
  .swatch {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    border-radius: 50%;
    box-shadow: inset -6px -6px 10px rgba(0, 0, 0, 0.5);
  }
  .info h2 { margin: 0; font-size: clamp(1.5rem, 3vw, 2rem); }
  .info-kind { margin: 0.3rem 0 0; color: var(--accent); font-weight: 600; font-size: 1.02rem; }
  .info-fact { margin: 0.6rem 0 0; font-size: clamp(1.1rem, 2.1vw, 1.3rem); line-height: 1.45; }
  .close {
    position: absolute;
    top: 10px; right: 10px;
    width: 44px; height: 44px;
    padding: 0;
    font-size: 1.6rem;
    line-height: 1;
  }

  noscript {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem; text-align: center; font-size: 1.3rem;
  }

  @media (max-width: 640px) {
    .top { padding-left: 12px; padding-right: 12px; }
    button { font-size: 0.95rem; padding: 0.5rem 0.8rem; }
  }
</style>
</head>
<body>

<canvas id="space" role="img" aria-label="A 3D model of the Sun and the eight planets moving around it"></canvas>

<div class="top">
  <header class="intro">
    <h1>Our Solar System</h1>
    <p class="how">Drag to turn it &middot; Pinch or scroll to zoom &middot; Tap a planet to learn about it</p>
    <p class="scale-note"><strong>Not to scale:</strong> the planets are really much smaller and much farther apart.
      They are drawn bigger and closer together here so everything fits on the screen.</p>
  </header>
  <div class="controls">
    <button id="playBtn" type="button">Pause</button>
    <button id="namesBtn" type="button" aria-pressed="true">Names: on</button>
    <button id="resetBtn" type="button">Reset view</button>
  </div>
</div>

<section id="info" class="info" hidden aria-live="polite">
  <button id="closeInfo" class="close" type="button" aria-label="Close">&times;</button>
  <div class="info-head">
    <span id="infoSwatch" class="swatch"></span>
    <h2 id="infoName"></h2>
  </div>
  <p id="infoKind" class="info-kind"></p>
  <p id="infoFact" class="info-fact"></p>
</section>

<nav id="chips" class="chips" aria-label="Choose the Sun or a planet"></nav>

<noscript>This model needs JavaScript. Please turn JavaScript on in your browser.</noscript>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------
  // The Sun and planets. Sizes and distances are NOT to scale.
  // "period" is the real length of a year in Earth years; it is only
  // used to make inner planets go round faster than outer ones.
  // ---------------------------------------------------------------
  var BODIES = [
    { id: 'sun', name: 'The Sun', kind: 'A star, right in the middle of our solar system',
      fact: 'The Sun is a star, not a planet. It is so big that about 1.3 million Earths could fit inside it!',
      color: '#ffb52e', size: 9, orbit: 0, period: 0 },
    { id: 'mercury', name: 'Mercury', kind: 'Planet 1 from the Sun (the closest)',
      fact: 'Mercury is the smallest planet. It zooms around the Sun so fast that one year on Mercury is only 88 Earth days long.',
      color: '#b3aaa1', size: 1.1, orbit: 17, period: 0.24,
      spots: [[-0.3, -0.2, 0.22, 'rgba(90,80,75,0.5)'], [0.25, 0.35, 0.16, 'rgba(90,80,75,0.5)']] },
    { id: 'venus', name: 'Venus', kind: 'Planet 2 from the Sun',
      fact: 'Venus is the hottest planet, even hotter than Mercury! Its thick clouds trap heat like a blanket, so it is about 465 °C (870 °F) there.',
      color: '#e6c07a', size: 1.7, orbit: 24, period: 0.62,
      bands: [[-0.4, 0.22, 'rgba(255,240,200,0.25)'], [0.15, 0.2, 'rgba(180,130,60,0.25)']] },
    { id: 'earth', name: 'Earth', kind: 'Planet 3 from the Sun (our home!)',
      fact: 'Earth is the only planet we know of that has living things on it. Most of its surface is covered by oceans.',
      color: '#2f78d6', size: 1.8, orbit: 32, period: 1,
      spots: [[-0.35, -0.15, 0.4, '#3f9a4a'], [0.4, 0.3, 0.32, '#4aa356'], [0, -0.92, 0.38, '#eef4ff'], [0.05, 0.95, 0.3, '#eef4ff']] },
    { id: 'mars', name: 'Mars', kind: 'Planet 4 from the Sun',
      fact: 'Mars is called the Red Planet because its ground is covered in rusty, reddish dust.',
      color: '#c4532e', size: 1.35, orbit: 40, period: 1.88,
      spots: [[0.2, 0.1, 0.35, 'rgba(110,40,20,0.45)'], [0, -0.92, 0.3, '#f4e8e0']] },
    { id: 'jupiter', name: 'Jupiter', kind: 'Planet 5 from the Sun (the biggest)',
      fact: 'Jupiter is the biggest planet. It has a giant storm called the Great Red Spot that is wider than the whole Earth!',
      color: '#d8b48c', size: 4.4, orbit: 55, period: 11.86,
      bands: [[-0.75, 0.16, 'rgba(140,90,55,0.55)'], [-0.42, 0.18, 'rgba(150,95,60,0.6)'], [-0.08, 0.14, 'rgba(250,235,210,0.5)'],
              [0.18, 0.2, 'rgba(155,100,62,0.6)'], [0.55, 0.14, 'rgba(140,90,55,0.5)']],
      spots: [[0.3, 0.3, 0.17, '#b8523a']] },
    { id: 'saturn', name: 'Saturn', kind: 'Planet 6 from the Sun',
      fact: 'Saturn’s rings are made of billions of pieces of ice and rock. Some are as tiny as dust and some are as big as a house!',
      color: '#e3cd94', size: 3.7, orbit: 71, period: 29.46, ring: true,
      bands: [[-0.6, 0.2, 'rgba(190,160,100,0.45)'], [-0.15, 0.15, 'rgba(255,245,215,0.4)'], [0.3, 0.22, 'rgba(190,160,100,0.4)']] },
    { id: 'uranus', name: 'Uranus', kind: 'Planet 7 from the Sun',
      fact: 'Uranus spins on its side, so it looks like it is rolling around the Sun like a ball.',
      color: '#93d9df', size: 2.7, orbit: 85, period: 84 },
    { id: 'neptune', name: 'Neptune', kind: 'Planet 8 from the Sun (the farthest)',
      fact: 'Neptune has the fastest winds in the solar system. They blow at more than 2,000 km/h (1,200 mph)!',
      color: '#3e62dc', size: 2.6, orbit: 98, period: 164.8,
      bands: [[-0.3, 0.14, 'rgba(120,160,255,0.35)'], [0.25, 0.12, 'rgba(30,40,140,0.35)']],
      spots: [[-0.25, 0.1, 0.16, 'rgba(20,30,110,0.6)']] }
  ];

  var TAU = Math.PI * 2;
  var SUN = BODIES[0];
  var RING_TILT = 0.47;                 // Saturn's rings lean over a little
  var DEFAULT_CAM = { yaw: 0.55, pitch: 0.42, dist: 300 };
  var MIN_DIST = 110, MAX_DIST = 800;
  var MIN_PITCH = -1.45, MAX_PITCH = 1.45;

  // Spread the planets out around the Sun at the start (fixed, so it looks the same every time).
  BODIES.forEach(function (b, i) {
    b.phase = i * 2.2;
    b.speed = b.period ? 0.32 / Math.sqrt(b.period) : 0;   // radians per second (not real speed)
    b.hitSize = b.ring ? b.size * 2.2 : b.size;
    b.pos = { x: 0, y: 0, z: 0 };
    b.s = { x: 0, y: 0, depth: 1, scale: 1, cx: 0, cy: 0, cz: 0 };
    b.visible = false;
    b.sr = 0;
  });

  var canvas = document.getElementById('space');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, F = 1;
  var cam = { yaw: DEFAULT_CAM.yaw, pitch: DEFAULT_CAM.pitch, dist: DEFAULT_CAM.dist };
  var trig = { cy: 1, sy: 0, cp: 1, sp: 0 };
  var playing = true;
  var showNames = true;
  var selected = null;
  var simTime = 0;
  var spin = { yaw: 0, pitch: 0 };       // gentle "keep spinning" after a flick

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    F = Math.min(W * 1.3, H * 1.75);
    // On a tall screen (tablet held upright) tilt the model more so it fills the space.
    DEFAULT_CAM.pitch = H > W * 1.1 ? 0.72 : 0.42;
  }
  window.addEventListener('resize', resize);
  resize();
  cam.pitch = DEFAULT_CAM.pitch;

  function updateTrig() {
    trig.cy = Math.cos(cam.yaw); trig.sy = Math.sin(cam.yaw);
    trig.cp = Math.cos(cam.pitch); trig.sp = Math.sin(cam.pitch);
  }

  // Turn a 3D point into a spot on the screen.
  function project(x, y, z, out) {
    var x1 = x * trig.cy - z * trig.sy;
    var z1 = x * trig.sy + z * trig.cy;
    var y2 = y * trig.cp - z1 * trig.sp;
    var z2 = y * trig.sp + z1 * trig.cp;
    var depth = cam.dist - z2;
    var scale = F / Math.max(depth, 0.001);
    out.x = W / 2 + x1 * scale;
    out.y = H / 2 - y2 * scale;
    out.depth = depth;
    out.scale = scale;
    out.cx = x1; out.cy = y2; out.cz = z2;
    return out;
  }

  // ---------------- Stars ----------------
  var stars = [];
  (function makeStars() {
    var seed = 12345;
    function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    for (var i = 0; i < 700; i++) {
      var u = rand() * 2 - 1, t = rand() * TAU, r = Math.sqrt(1 - u * u);
      stars.push({ x: r * Math.cos(t) * 2000, y: u * 2000, z: r * Math.sin(t) * 2000,
                   b: 0.25 + rand() * 0.75, s: rand() < 0.08 ? 1.6 : 0.9 + rand() * 0.5 });
    }
  })();
  var tmp = { x: 0, y: 0, depth: 0, scale: 0, cx: 0, cy: 0, cz: 0 };

  function drawBackground() {
    ctx.fillStyle = '#03040b';
    ctx.fillRect(0, 0, W, H);
    var g = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(40, 45, 90, 0.35)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      project(st.x, st.y, st.z, tmp);
      if (tmp.depth <= 1 || tmp.x < -2 || tmp.y < -2 || tmp.x > W + 2 || tmp.y > H + 2) continue;
      ctx.fillStyle = 'rgba(255,255,255,' + st.b.toFixed(2) + ')';
      ctx.fillRect(tmp.x, tmp.y, st.s, st.s);
    }
  }

  // ---------------- Orbits ----------------
  var orbitPt = { x: 0, y: 0, depth: 0, scale: 0, cx: 0, cy: 0, cz: 0 };
  function drawOrbits() {
    for (var i = 1; i < BODIES.length; i++) {
      var b = BODIES[i];
      var isSel = selected === b;
      ctx.beginPath();
      var penDown = false;
      var steps = 160;
      for (var k = 0; k <= steps; k++) {
        var a = k / steps * TAU;
        project(Math.cos(a) * b.orbit, 0, -Math.sin(a) * b.orbit, orbitPt);
        if (orbitPt.depth < 4) { penDown = false; continue; }
        if (penDown) ctx.lineTo(orbitPt.x, orbitPt.y); else ctx.moveTo(orbitPt.x, orbitPt.y);
        penDown = true;
      }
      ctx.strokeStyle = isSel ? 'rgba(255, 207, 90, 0.75)' : 'rgba(170, 185, 255, 0.22)';
      ctx.lineWidth = isSel ? 2 : 1;
      ctx.stroke();
    }
  }

  // ---------------- Sun ----------------
  function drawSun(s) {
    var r = SUN.size * s.scale;
    var glow = ctx.createRadialGradient(s.x, s.y, r * 0.6, s.x, s.y, r * 3.2);
    glow.addColorStop(0, 'rgba(255, 190, 70, 0.55)');
    glow.addColorStop(0.4, 'rgba(255, 140, 30, 0.15)');
    glow.addColorStop(1, 'rgba(255, 120, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(s.x, s.y, r * 3.2, 0, TAU); ctx.fill();

    var body = ctx.createRadialGradient(s.x - r * 0.25, s.y - r * 0.25, r * 0.1, s.x, s.y, r);
    body.addColorStop(0, '#fffbe0');
    body.addColorStop(0.45, '#ffd84a');
    body.addColorStop(0.85, '#ff9f1a');
    body.addColorStop(1, '#f07800');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU); ctx.fill();
    return r;
  }

  // ---------------- Planets ----------------
  function drawPlanet(b, s, sunS) {
    var r = Math.max(b.size * s.scale, 1);
    ctx.save();
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, TAU);
    ctx.fillStyle = b.color;
    ctx.fill();
    ctx.clip();

    if (b.bands) {
      for (var i = 0; i < b.bands.length; i++) {
        var bd = b.bands[i];
        ctx.fillStyle = bd[2];
        ctx.fillRect(s.x - r, s.y + bd[0] * r, r * 2, bd[1] * r);
      }
    }
    if (b.spots) {
      for (var j = 0; j < b.spots.length; j++) {
        var sp = b.spots[j];
        ctx.fillStyle = sp[3];
        ctx.beginPath();
        ctx.ellipse(s.x + sp[0] * r, s.y + sp[1] * r, sp[2] * r * 1.3, sp[2] * r, 0, 0, TAU);
        ctx.fill();
      }
    }

    // Light and shadow: the side facing the Sun is bright.
    var lx = sunS.cx - s.cx, ly = sunS.cy - s.cy, lz = sunS.cz - s.cz;
    var len2 = Math.hypot(lx, ly) || 1;
    var len3 = Math.hypot(lx, ly, lz) || 1;
    var k = 0.62 * (1 - lz / len3);
    var hx = s.x + (lx / len2) * r * k;
    var hy = s.y - (ly / len2) * r * k;
    var g = ctx.createRadialGradient(hx, hy, 0, hx, hy, r * 2.1);
    g.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
    g.addColorStop(0.22, 'rgba(255, 255, 255, 0)');
    g.addColorStop(0.5, 'rgba(0, 0, 0, 0.2)');
    g.addColorStop(0.85, 'rgba(0, 0, 0, 0.88)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
    ctx.fillStyle = g;
    ctx.fillRect(s.x - r - 1, s.y - r - 1, r * 2 + 2, r * 2 + 2);
    ctx.restore();
    return r;
  }

  // Saturn's rings: split into the half behind the planet and the half in front.
  var RING_EDGES = [1.3, 1.55, 1.9, 2.02, 2.35];
  var RING_ALPHA = [0.4, 0.8, 0.12, 0.6];
  var ringPts = [];
  for (var rp = 0; rp < RING_EDGES.length * 97; rp++) ringPts.push({ x: 0, y: 0, depth: 0, scale: 0, cx: 0, cy: 0, cz: 0 });

  function prepareRing(b) {
    var N = 96, ct = Math.cos(RING_TILT), st = Math.sin(RING_TILT);
    for (var e = 0; e < RING_EDGES.length; e++) {
      var rr = RING_EDGES[e] * b.size;
      for (var k = 0; k <= N; k++) {
        var a = k / N * TAU;
        var lx = Math.cos(a) * rr, lz = Math.sin(a) * rr;
        project(b.pos.x + lx, -lz * st, b.pos.z + lz * ct, ringPts[e * 97 + k]);
      }
    }
  }

  function drawRingHalf(b, front) {
    var N = 96, cDepth = b.s.depth;
    for (var e = 0; e < RING_EDGES.length - 1; e++) {
      ctx.beginPath();
      var any = false;
      for (var k = 0; k < N; k++) {
        var p1 = ringPts[e * 97 + k], p2 = ringPts[e * 97 + k + 1];
        var p3 = ringPts[(e + 1) * 97 + k + 1], p4 = ringPts[(e + 1) * 97 + k];
        if (p1.depth < 2 || p2.depth < 2 || p3.depth < 2 || p4.depth < 2) continue;
        var mid = (p1.depth + p2.depth + p3.depth + p4.depth) / 4;
        if ((mid < cDepth) !== front) continue;
        ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath();
        any = true;
      }
      if (any) {
        ctx.fillStyle = 'rgba(226, 206, 160,' + RING_ALPHA[e] + ')';
        ctx.fill();
      }
    }
  }

  // Names: try below, above, right, then left of each body, picking the first
  // spot that does not overlap a name already placed (or the Sun).
  function overlaps(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }
  function drawLabels(list) {
    var size = Math.round(Math.max(13, Math.min(17, Math.min(W, H) / 48)));
    var font = 'px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.lineWidth = 4;
    // selected first, then the Sun, then bigger-looking bodies first
    list = list.filter(function (it) { return showNames || it[0] === selected; });
    list.sort(function (p, q) {
      var ps = (p[0] === selected ? 1e6 : 0) + (p[0] === SUN ? 1e5 : 0) + p[1];
      var qs = (q[0] === selected ? 1e6 : 0) + (q[0] === SUN ? 1e5 : 0) + q[1];
      return qs - ps;
    });
    var placed = [];
    if (SUN.visible) {
      var sr = SUN.sr * 0.9;
      placed.push({ x: SUN.s.x - sr, y: SUN.s.y - sr, w: sr * 2, h: sr * 2 });
    }
    for (var i = 0; i < list.length; i++) {
      var b = list[i][0], r = list[i][1] * (b.ring ? 1.25 : 1), s = b.s;
      var isSel = b === selected;
      ctx.font = (isSel ? '700 ' : '600 ') + size + font;
      var label = b === SUN ? 'Sun' : b.name;
      var w = ctx.measureText(label).width, h = size + 2, gap = 5;
      var spots = [
        { x: s.x - w / 2, y: s.y + r + gap },
        { x: s.x - w / 2, y: s.y - r - gap - h },
        { x: s.x + r + gap + 2, y: s.y - h / 2 },
        { x: s.x - r - gap - 2 - w, y: s.y - h / 2 },
        { x: s.x + r + gap, y: s.y + r * 0.5 + gap },
        { x: s.x - r - gap - w, y: s.y + r * 0.5 + gap },
        { x: s.x + r + gap, y: s.y - r * 0.5 - gap - h },
        { x: s.x - r - gap - w, y: s.y - r * 0.5 - gap - h }
      ];
      // pick the first free spot; if none is free, the one that overlaps least
      var spot = spots[0], leastOverlap = Infinity;
      for (var k = 0; k < spots.length; k++) {
        var box = { x: spots[k].x - 2, y: spots[k].y - 1, w: w + 4, h: h + 2 };
        var area = 0;
        for (var m = 0; m < placed.length; m++) {
          if (b === SUN && m === 0) continue;   // the Sun's own name may touch the Sun
          var pm = placed[m];
          if (overlaps(box, pm)) {
            area += (Math.min(box.x + box.w, pm.x + pm.w) - Math.max(box.x, pm.x)) *
                    (Math.min(box.y + box.h, pm.y + pm.h) - Math.max(box.y, pm.y));
          }
        }
        if (area < leastOverlap) { leastOverlap = area; spot = spots[k]; }
        if (area === 0) break;
      }
      placed.push({ x: spot.x - 2, y: spot.y - 1, w: w + 4, h: h + 2 });
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.strokeText(label, spot.x, spot.y);
      ctx.fillStyle = isSel ? '#ffcf5a' : 'rgba(235, 240, 255, 0.92)';
      ctx.fillText(label, spot.x, spot.y);
    }
  }

  function drawSelection(s, r, now) {
    var pulse = 1 + 0.08 * Math.sin(now / 250);
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 207, 90, 0.95)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.arc(s.x, s.y, (r + 7) * pulse, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  // ---------------- Main drawing ----------------
  var order = BODIES.slice();
  function draw(now) {
    updateTrig();
    drawBackground();

    for (var i = 0; i < BODIES.length; i++) {
      var b = BODIES[i];
      var a = b.phase + simTime * b.speed;
      b.pos.x = Math.cos(a) * b.orbit;
      b.pos.y = 0;
      b.pos.z = -Math.sin(a) * b.orbit;
      project(b.pos.x, b.pos.y, b.pos.z, b.s);
      b.visible = b.s.depth > 3;
      b.sr = b.size * b.s.scale;
    }

    drawOrbits();

    order.sort(function (p, q) { return q.s.depth - p.s.depth; });
    var labels = [];
    for (var j = 0; j < order.length; j++) {
      var o = order[j];
      if (!o.visible) continue;
      var r;
      if (o === SUN) {
        r = drawSun(o.s);
      } else if (o.ring) {
        prepareRing(o);
        drawRingHalf(o, false);
        r = drawPlanet(o, o.s, SUN.s);
        drawRingHalf(o, true);
      } else {
        r = drawPlanet(o, o.s, SUN.s);
      }
      if (selected === o) drawSelection(o.s, o.ring ? r * 2.35 : r, now);
      labels.push([o, r]);
    }
    // Names go on top of everything so the Sun never hides them.
    drawLabels(labels);
  }

  // ---------------- Animation loop ----------------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (playing) simTime += dt;
    if (!dragging && spin.yaw) {
      cam.yaw += spin.yaw * dt;
      spin.yaw *= Math.exp(-4 * dt);
      if (Math.abs(spin.yaw) < 0.01) spin.yaw = 0;
    }
    draw(now);
    requestAnimationFrame(frame);
  }

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  // ---------------- Picking a planet ----------------
  function pick(x, y) {
    var best = null, bestScore = Infinity;
    var minHit = 24;   // big enough for a finger, even for tiny Mercury
    for (var i = 0; i < BODIES.length; i++) {
      var b = BODIES[i];
      if (!b.visible) continue;
      var d = Math.hypot(x - b.s.x, y - b.s.y);
      var hitR = Math.max(b.hitSize * b.s.scale + 4, minHit);
      if (d > hitR) continue;
      // Skip a planet that is hidden behind something bigger and nearer.
      var hidden = false;
      for (var j = 0; j < BODIES.length; j++) {
        var o = BODIES[j];
        if (o === b || !o.visible) continue;
        if (o.s.depth < b.s.depth && o.sr > b.sr &&
            Math.hypot(b.s.x - o.s.x, b.s.y - o.s.y) < o.sr) { hidden = true; break; }
      }
      if (hidden) continue;
      var score = d / hitR;
      if (score < bestScore) { bestScore = score; best = b; }
    }
    return best;
  }

  // ---------------- Info card ----------------
  var info = document.getElementById('info');
  var infoName = document.getElementById('infoName');
  var infoKind = document.getElementById('infoKind');
  var infoFact = document.getElementById('infoFact');
  var infoSwatch = document.getElementById('infoSwatch');
  var chipsEl = document.getElementById('chips');
  var chipButtons = [];

  function select(b) {
    selected = b || null;
    if (!b) {
      info.hidden = true;
    } else {
      infoName.textContent = b.name;
      infoKind.textContent = b.kind;
      infoFact.textContent = b.fact;
      infoSwatch.style.background = b.color;
      info.hidden = false;
      // restart the little pop-in animation
      info.style.animation = 'none'; void info.offsetWidth; info.style.animation = '';
    }
    chipButtons.forEach(function (c) { c.setAttribute('aria-pressed', String(c._body === selected)); });
  }

  BODIES.forEach(function (b) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.setAttribute('aria-pressed', 'false');
    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = b.color;
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(b.id === 'sun' ? 'Sun' : b.name));
    btn._body = b;
    btn.addEventListener('click', function () { select(selected === b ? null : b); });
    chipsEl.appendChild(btn);
    chipButtons.push(btn);
  });

  document.getElementById('closeInfo').addEventListener('click', function () { select(null); });

  // ---------------- Buttons ----------------
  var playBtn = document.getElementById('playBtn');
  var namesBtn = document.getElementById('namesBtn');
  function setPlaying(p) {
    playing = p;
    playBtn.textContent = p ? 'Pause' : 'Play';
  }
  playBtn.addEventListener('click', function () { setPlaying(!playing); });
  namesBtn.addEventListener('click', function () {
    showNames = !showNames;
    namesBtn.textContent = showNames ? 'Names: on' : 'Names: off';
    namesBtn.setAttribute('aria-pressed', String(showNames));
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    cam.yaw = DEFAULT_CAM.yaw; cam.pitch = DEFAULT_CAM.pitch; cam.dist = DEFAULT_CAM.dist;
    spin.yaw = 0; spin.pitch = 0;
  });

  // ---------------- Mouse and touch ----------------
  var pointers = new Map();
  var dragging = false;
  var gesture = null;          // { startX, startY, moved, lastX, lastY, lastT, vx, vy }
  var pinch = null;            // { d, dist }
  var TURN = 0.0065;           // how much the model turns per pixel dragged

  function pinchDistance() {
    var pts = Array.from(pointers.values());
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    spin.yaw = 0; spin.pitch = 0;
    if (pointers.size === 1) {
      dragging = true;
      canvas.classList.add('dragging');
      gesture = { startX: e.clientX, startY: e.clientY, moved: 0, lastX: e.clientX, lastY: e.clientY,
                  lastT: performance.now(), vx: 0, vy: 0 };
    } else if (pointers.size === 2) {
      pinch = { d: pinchDistance(), dist: cam.dist };
      if (gesture) gesture.moved = 1000;   // a pinch is never a tap
    }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) {
      if (e.pointerType === 'mouse') canvas.classList.toggle('over-planet', !!pick(e.clientX, e.clientY));
      return;
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size >= 2 && pinch) {
      cam.dist = clamp(pinch.dist * pinch.d / pinchDistance(), MIN_DIST, MAX_DIST);
      return;
    }
    if (!gesture) return;
    var dx = e.clientX - gesture.lastX, dy = e.clientY - gesture.lastY;
    var now = performance.now();
    var dtm = Math.max(now - gesture.lastT, 1);
    gesture.moved += Math.abs(dx) + Math.abs(dy);
    cam.yaw += dx * TURN;
    cam.pitch = clamp(cam.pitch + dy * TURN, MIN_PITCH, MAX_PITCH);
    // smoothed sideways speed, used for a gentle spin after a quick flick
    gesture.vx = gesture.vx * 0.6 + (dx * TURN / (dtm / 1000)) * 0.4;
    gesture.lastX = e.clientX; gesture.lastY = e.clientY; gesture.lastT = now;
  });

  function endPointer(e, cancelled) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      // went from pinch back to one finger: carry on turning from here, no tap
      var p = Array.from(pointers.values())[0];
      gesture = { startX: p.x, startY: p.y, moved: 1000, lastX: p.x, lastY: p.y, lastT: performance.now(), vx: 0, vy: 0 };
      pinch = null;
      return;
    }
    if (pointers.size === 0) {
      dragging = false;
      canvas.classList.remove('dragging');
      pinch = null;
      if (gesture && !cancelled) {
        if (gesture.moved < 10) {
          select(pick(e.clientX, e.clientY));
        } else if (performance.now() - gesture.lastT < 80) {
          spin.yaw = clamp(gesture.vx, -2.5, 2.5);
        }
      }
      gesture = null;
    }
  }
  canvas.addEventListener('pointerup', function (e) { endPointer(e, false); });
  canvas.addEventListener('pointercancel', function (e) { endPointer(e, true); });
  canvas.addEventListener('lostpointercapture', function (e) { endPointer(e, true); });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var delta = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
    cam.dist = clamp(cam.dist * Math.exp(delta * 0.0012), MIN_DIST, MAX_DIST);
  }, { passive: false });

  // Stop Safari on iPad from zooming the whole page with a pinch.
  ['gesturestart', 'gesturechange'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); });
  });

  // ---------------- Keyboard (handy on a laptop in class) ----------------
  document.addEventListener('keydown', function (e) {
    var onButton = e.target && e.target.tagName === 'BUTTON';
    switch (e.key) {
      case 'ArrowLeft': cam.yaw -= 0.08; break;
      case 'ArrowRight': cam.yaw += 0.08; break;
      case 'ArrowUp': cam.pitch = clamp(cam.pitch - 0.06, MIN_PITCH, MAX_PITCH); break;
      case 'ArrowDown': cam.pitch = clamp(cam.pitch + 0.06, MIN_PITCH, MAX_PITCH); break;
      case '+': case '=': cam.dist = clamp(cam.dist * 0.9, MIN_DIST, MAX_DIST); break;
      case '-': case '_': cam.dist = clamp(cam.dist / 0.9, MIN_DIST, MAX_DIST); break;
      case 'Escape': select(null); break;
      case ' ':
        if (onButton) return;
        setPlaying(!playing); break;
      default: return;
    }
    e.preventDefault();
  });

  // Small read-only helper so the page can be checked automatically.
  window.solarModel = {
    screenPosition: function (id) {
      for (var i = 0; i < BODIES.length; i++) {
        if (BODIES[i].id === id) return { x: BODIES[i].s.x, y: BODIES[i].s.y, r: BODIES[i].sr, visible: BODIES[i].visible };
      }
      return null;
    },
    camera: function () { return { yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist }; },
    selected: function () { return selected ? selected.id : null; }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
